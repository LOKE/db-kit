on:
  push:
    branches:
      - master
jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # required for npm OIDC trusted publishing

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm publish --access public
